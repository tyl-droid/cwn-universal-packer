[package]
name = "cwn-universal-packer"
version = "0.9.0-alpha"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
walkdir = "2.5.0"
zstd = "0.14.0"

[[bin]]
name = "cwnpack"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2.2.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = "0.36.2"
rfd = "0.17.2"
